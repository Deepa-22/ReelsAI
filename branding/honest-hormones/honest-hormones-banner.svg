<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Background gradient: cream → soft rose -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F4"/>
      <stop offset="55%" stop-color="#F5E6D8"/>
      <stop offset="100%" stop-color="#E8A0B7" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#E8A0B7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E8A0B7" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.90 0 0 0 0 0.88 0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#bg)"/>
  <rect width="2560" height="1440" fill="url(#halo)"/>
  <rect width="2560" height="1440" filter="url(#grain)" opacity="0.4"/>

  <!-- Decorative floating particles (top right + bottom left) -->
  <g fill="#E8A0B7" opacity="0.45">
    <circle cx="2150" cy="280" r="3"/>
    <circle cx="2280" cy="380" r="4"/>
    <circle cx="2090" cy="450" r="2"/>
    <circle cx="2330" cy="220" r="3"/>
    <circle cx="2220" cy="540" r="3"/>
    <circle cx="2400" cy="320" r="2"/>
  </g>
  <g fill="#A8B9A0" opacity="0.5">
    <circle cx="320" cy="1180" r="3"/>
    <circle cx="220" cy="1080" r="4"/>
    <circle cx="450" cy="1220" r="2"/>
    <circle cx="180" cy="1240" r="3"/>
    <circle cx="380" cy="1100" r="2"/>
  </g>

  <!-- Crescent moon symbol (top left) -->
  <g transform="translate(360, 380)" opacity="0.85">
    <circle cx="0" cy="0" r="36" fill="#3D1F2E"/>
    <circle cx="14" cy="-6" r="32" fill="#FAF7F4"/>
    <circle cx="55" cy="-20" r="4" fill="#E8A0B7"/>
  </g>

  <!-- Main wordmark — centered in safe zone (1546 x 423 centered) -->
  <g transform="translate(1280, 720)" text-anchor="middle" font-family="Cormorant Garamond, Playfair Display, serif">

    <!-- Top eyebrow -->
    <text y="-160" font-size="38" letter-spacing="12" fill="#A8B9A0" font-weight="400">
      REAL · HORMONAL · HONEST
    </text>

    <!-- Wordmark -->
    <text y="-30" font-size="280" font-weight="500" fill="#3D1F2E" letter-spacing="-6">
      honest hormones
    </text>

    <!-- Underline accent -->
    <rect x="-280" y="20" width="560" height="6" fill="#E8A0B7" rx="3"/>

    <!-- Tagline -->
    <text y="120" font-size="46" font-style="italic" fill="#3D1F2E" opacity="0.75" font-weight="400">
      Real stories. Real hormones. Honestly.
    </text>

    <!-- Handle -->
    <text y="220" font-size="32" letter-spacing="6" fill="#E8A0B7" font-family="Inter, sans-serif" font-weight="600">
      @HONESTHORMONES
    </text>
  </g>
</svg>
