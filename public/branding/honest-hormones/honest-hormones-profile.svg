<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF7F4"/>
      <stop offset="100%" stop-color="#E8A0B7"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full bleed background (will be cropped to circle by platforms) -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#halo)"/>

  <!-- Centered crescent moon -->
  <g transform="translate(540, 480)">
    <circle cx="0" cy="0" r="220" fill="#3D1F2E"/>
    <circle cx="80" cy="-30" r="195" fill="#FAF7F4"/>
    <circle cx="280" cy="-110" r="14" fill="#E8A0B7"/>
    <circle cx="-220" cy="-180" r="6" fill="#E8A0B7" opacity="0.7"/>
    <circle cx="-260" cy="60" r="5" fill="#A8B9A0" opacity="0.7"/>
  </g>

  <!-- "hh" lowercase mark below moon -->
  <text x="540" y="900" text-anchor="middle" font-family="Cormorant Garamond, Playfair Display, serif"
        font-size="180" font-weight="500" fill="#3D1F2E" letter-spacing="-8">
    hh
  </text>

  <!-- Underline accent -->
  <rect x="430" y="930" width="220" height="6" rx="3" fill="#E8A0B7"/>
</svg>
